[project]
name = "wyy-yupao-mcp"
version = "0.7.0"
description = "Local Yupao job search and application-preparation MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "httpx>=0.28,<0.29"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
chat = ["playwright>=1.56,<2"]

[project.scripts]
yupao-mcp = "yupao_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yupao_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
